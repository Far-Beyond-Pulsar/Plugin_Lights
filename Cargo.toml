[package]
name = "lights_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lights (`pulsar.lights`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# The editor's registrations (the hierarchy icon, the Create menu's lights,
# the environment mixer's entries and starter setups) and the crates they
# need. A game links the root without it, so it takes no editor dependency.
editor = ["dep:lights_editor", "dep:ui_level_editor"]

[dependencies]
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
# The plugin's crates.
lights_component = { workspace = true }
helio-light-api = { workspace = true }
lights_editor = { workspace = true, optional = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
helio_component = { workspace = true }
pulsar_settings = { workspace = true }
pulsar_world_registry = { workspace = true }
# The editor's extension points.
ui_level_editor = { workspace = true, optional = true }

[dev-dependencies]
# The icon picking test registers a test kind's content geometry.
inventory = { workspace = true }
# The plugin's integration tests (`tests/`): the plugin as a game links it,
# with the meshes these tests light and pick against.
pulsar_scenedb = { workspace = true }
meshes_plugin = { workspace = true }
meshes_component = { workspace = true }
helio-mesh-api = { workspace = true }
helio-pass-object-batch = { workspace = true }
helio-pass-billboard = { workspace = true }
helio = { workspace = true }
pulsar_class = { workspace = true }
pulsar_events = { workspace = true }
pulsar_scene = { workspace = true }
pulsar_scene_model = { workspace = true }
pulsar_script_object_model = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true }
pollster = "=0.4.0"
tempfile = { workspace = true }
parking_lot = { workspace = true }

[lints]
workspace = true
