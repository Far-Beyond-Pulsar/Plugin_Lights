# The lights plugin's rows of the SceneDB closure ledger (Pulsar-Native#1035):
# its classes, GPU schemas, buffers, pass crates and call sites. A plugin owns
# the rows of what it ships (Pulsar-Native#1606); `cargo test -p scene_inventory`
# in a Pulsar-Native checkout recomputes every fact column, checks the human
# columns, and fails on a missing, stale or misplaced row. The columns are
# described in Pulsar-Native's crates/core/scene_inventory/ledger.toml.

# ── GPU-bearing schemas ─────────────────────────────────────────

[[schema]]
type = "LightComponent"
path = "lights_component::light::component::LightComponent"
buffers = ["scene_lights"]
clears_on_remove = true
releases_var_len = false
registered = true
writer = "none in Pulsar: the scene join publishes `scene_lights` rows of this layout from LightSourceRow and the owner transform"
owner = "lights_component::light::component"
disposition = "replaced for Pulsar (Phase 2): lights are joined on the GPU; the component remains a Helio demo type (Phase 4)"
target_contract = "Phase 2; 03-gpu-reflection-and-rendering.md"
test = "plugins/installed/tests/render_acceptance.rs"
status = "verified"

[[schema]]
type = "LightComponentGpuMirror"
path = "lights_component::light::component::LightComponentGpuMirror"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "none: the generated companion uploads a GPU row only for an #[engine_class(gpu_rows)] class (Phase 4); no engine class opts in"
owner = "lights_component::light::component"
disposition = "keep as a CPU mapping type (LightComponent's derived LightSourceRow is built from its mirror); nothing is uploaded"
target_contract = "Phase 4; 03-gpu-reflection-and-rendering.md"
test = "crates/core/engine_class_derive/tests/gpu_mirror_derive.rs (without_gpu_rows_the_companion_uploads_nothing)"
status = "verified"

[[schema]]
type = "LightSourceRow"
path = "lights_component::light::source_row::LightSourceRow"
buffers = ["light_sources"]
clears_on_remove = true
releases_var_len = false
registered = true
writer = "LightComponent's second GPU registration (to_helio_gpu_light of the authored value, enabled flag in the padding word), on every insert, write, removal and replay"
owner = "lights_component::light::source_row"
disposition = "keep: the scene join's light input (Phase 2)"
target_contract = "Phase 2; 03-gpu-reflection-and-rendering.md"
test = "plugins/installed/tests/render_acceptance.rs"
status = "verified"

