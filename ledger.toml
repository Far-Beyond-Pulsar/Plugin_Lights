disposition = "standalone-host row: linked into the editor only by the meshes editor's thumbnail renderer (helio_snapshot, which renders through Helio's standalone host, helio-mesh-host and helio-light-host); written only in the snapshot's own offscreen World, never in a level's"
target_contract = "Phase 4; plugin-migration.md (host rows for standalone hosts)"
test = "plugins/vendor/meshes/snapshot (thumbnails); plugins/vendor/meshes/editor thumbnails"
status = "verified"

