[package]
name = "lights_editor"
version = "0.1.0"
edition = "2024"
description = "Lights (pulsar.lights): the editor crate -- the level editor's light icon, Create menu lights, environment mixer entries and starter setups, over the plugin's component crate"

[lib]
name = "lights_editor"

[dependencies]
lights_component = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }
ui = { workspace = true }
gpui-ce = { workspace = true }
rust-i18n = { workspace = true }
engine_backend = { workspace = true }
pulsar_scenedb = { workspace = true }

[lints]
workspace = true
